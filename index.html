<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panier Malin — Smart Basket</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#1d2a22;--mute:#667269;--line:#e0e5de;--acc:#1f7a4d;--acc2:#e8f3ec;--warn:#b4531a;--good:#137a3a;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#121714;--card:#1b231e;--ink:#e8efe9;--mute:#9aa89e;--line:#2c3830;--acc:#4cc38a;--acc2:#1f2f26;--warn:#e59a63;--good:#5fd68b;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;max-width:860px;margin:0 auto}
header h1{font-size:20px;margin:0;letter-spacing:-.2px}
header h1 span{color:var(--acc)}
.lang button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 11px;cursor:pointer;font-weight:600}
.lang button:first-child{border-radius:8px 0 0 8px}.lang button:last-child{border-radius:0 8px 8px 0;border-left:0}
.lang button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main{max-width:860px;margin:0 auto;padding:0 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.card h2{font-size:16px;margin:0 0 10px;display:flex;gap:8px;align-items:center}
.num{background:var(--acc);color:#fff;border-radius:50%;width:24px;height:24px;display:inline-grid;place-items:center;font-size:13px}
.hint,.small{color:var(--mute);font-size:13px}
button.p,label.p{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:600;cursor:pointer;display:inline-block}
button.s{background:var(--acc2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:14px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
input[type=text],input[type=number],textarea,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.row>*{flex:0 0 auto}.row .grow{flex:1 1 180px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .2s}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mute);font-weight:600;font-size:12px;padding:4px}
td{padding:4px;vertical-align:middle}
td input{padding:6px 8px}
.item{border-top:1px solid var(--line);padding:12px 0}
.item:first-child{border-top:0}
.ihead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:600}
.paid{color:var(--mute);font-weight:400;font-size:13px}
.offer{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:9px;margin-top:6px;cursor:pointer;font-size:14px}
.offer.sel{border-color:var(--acc);background:var(--acc2)}
.offer .pr{font-weight:700;white-space:nowrap}
.offer .pr.cheap{color:var(--good)}.offer .pr.dear{color:var(--bad)}
.tag{font-size:11px;background:var(--line);border-radius:5px;padding:1px 6px;margin-left:6px;color:var(--mute)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:6px}
.sum div{background:var(--acc2);border-radius:10px;padding:10px 12px}
.sum b{display:block;font-size:20px}
.sum .save b{color:var(--good)}
.note{border-left:3px solid var(--warn);padding:6px 10px;color:var(--mute);font-size:13px;margin-top:10px}
.plan{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.plan h3{margin:0 0 6px;font-size:15px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.plan li{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:2px 0;list-style:none}
.plan ul{margin:0;padding:0}
.err{color:var(--bad);font-size:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1>Panier <span>Malin</span></h1>
  <div class="lang"><button id="bfr">FR</button><button id="ben">EN</button></div>
</header>
<main>

<section class="card">
  <h2><span class="num">1</span><span data-i="s1"></span></h2>
  <p class="hint" data-i="s1h"></p>
  <div class="row">
    <label class="p"><span data-i="photo"></span><input id="file" type="file" accept="image/*" capture="environment" hidden></label>
    <button class="s" id="impbtn" data-i="impfile"></button>
    <button class="s" id="listbtn" data-i="typelist"></button>
    <button class="s" id="paste" data-i="manual"></button>
    <button class="s" id="demo" data-i="demo"></button>
  </div>
  <input type="file" id="fimp" accept=".json,.xlsx,.xls,.csv,application/json" hidden>
  <div id="ocrbox" hidden><div class="small" id="ocrmsg"></div><div class="bar"><i id="ocrbar"></i></div></div>
  <div id="pastebox" hidden>
    <textarea id="rawtxt" data-ph="rawph"></textarea>
    <div class="row"><button class="p" id="parse" data-i="analyse"></button></div>
  </div>
  <div id="listbox" hidden>
    <p class="small" data-i="listh"></p>
    <textarea id="rawlist" data-ph="listph"></textarea>
    <div class="row"><button class="p" id="addlist" data-i="addlist"></button></div>
  </div>
  <div id="chips" class="row"></div>
  <p class="small" id="srcmsg"></p>
</section>

<section class="card" id="review" hidden>
  <h2><span class="num">2</span><span data-i="s2"></span></h2>
  <div class="row">
    <div class="grow"><label class="small" data-i="store"></label><input type="text" id="store"></div>
    <div><label class="small" data-i="date"></label><input type="text" id="rdate" style="width:130px"></div>
  </div>
  <table><thead><tr><th data-i="item"></th><th data-i="search"></th><th style="width:56px" data-i="qty"></th><th style="width:84px" data-i="total"></th><th style="width:30px"></th></tr></thead><tbody id="rows"></tbody></table>
  <div class="row"><button class="s" id="addrow" data-i="addrow"></button></div>
  <p class="small" data-i="searchhint"></p>
</section>

<section class="card" id="setcard" hidden>
  <h2><span class="num">3</span><span data-i="s3"></span></h2>
  <div class="row">
    <label><input type="radio" name="mode" value="near" checked> <span data-i="near"></span></label>
    <label><input type="radio" name="mode" value="online"> <span data-i="online"></span></label>
  </div>
  <div id="nearbox">
    <div class="row"><span data-i="radius"></span> <b id="rlab"></b></div>
    <input type="range" id="radius" min="0.5" max="50" step="0.5" value="2" style="width:100%">
    <div class="row">
      <button class="s" id="geo" data-i="geo"></button>
      <input type="text" id="addr" class="grow" data-ph="addrph">
      <button class="s" id="addrgo" data-i="find"></button>
    </div>
    <div class="small" id="locmsg"></div>
  </div>
  <div class="row"><span class="small" data-i="srcs"></span>
    <label><input type="checkbox" id="useop" checked> <span data-i="useop"></span></label>
    <label><input type="checkbox" id="usebase" checked> <span data-i="usebase"></span></label>
    <label><input type="checkbox" id="useest" checked> <span data-i="useest"></span></label></div>
  <div class="row"><label><input type="checkbox" id="keep" checked> <span data-i="keep"></span></label></div>
  <div class="row"><button class="p" id="go" data-i="compare"></button></div>
</section>

<section class="card" id="res" hidden>
  <h2><span class="num">4</span><span data-i="s4"></span></h2>
  <div class="bar" id="rbar"><i id="rbari"></i></div>
  <div id="stores"></div>
  <div id="summary"></div>
  <div id="list"></div>
  <h2 style="margin-top:18px" id="plantitle" hidden data-i="wheretitle"></h2>
  <div id="plan"></div>
  <div class="note" data-i="caveat"></div>
</section>

<section class="card">
  <h2 data-i="basetitle"></h2>
  <p class="small" id="basestat"></p>
  <div class="row"><button class="s" id="exp" data-i="export"></button><button class="s" id="expx" data-i="expxls"></button><button class="s" id="clr" data-i="clear"></button></div>
  
  <p class="small" data-i="privacy"></p>
</section>
</main>

let lang=localStorage.getItem('pm_lang')||((navigator.language||'fr').startsWith('en')?'en':'fr');
const t=k=>T[lang][k];
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
  bfr.classList.toggle('on',lang==='fr');ben.classList.toggle('on',lang==='en');
  radLab();locLab();baseStat();if(items.length)renderRows();
}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ============ PARSER ============ */
const STORES=['carrefour','leclerc','auchan','lidl','aldi','intermarch','monoprix','casino','franprix','super u','hyper u','u express','picard','biocoop','naturalia','cora','match','netto','grand frais','tesco','sainsbury','asda','walmart','kroger','costco','target','whole foods','mercadona','dia','colruyt','delhaize','spar','g20','simply market','carrefour city','carrefour market'];
const SKIP=/(sous[- ]?total|subtotal|\btotal|\btva\b|\bvat\b|\btax\b|\bcarte\b|\bcb\b|\bvisa\b|mastercard|esp[eè]ces|\bcash\b|\brendu\b|\bchange\b|monnaie|merci|thank|fid[eé]lit|\bpoints?\b|\bremise|r[eé]duction|net [àa] payer|paiement|payment|siret|\bt[eé]l\b|www|\bcaisse\b|h[oô]te|\bticket\b|facture|nb articles|articles?\s*:|\bavoir\b|cagnotte|\bdate\b|\bheure\b)/i;
const PRICE_END=/^(.*?)[\s.]*(-?\d{1,4}[.,]\s?\d{2})\s*(?:€|eur)?\s*[A-Z*]?\s*$/i;
function parseReceipt(text){
  const lines=text.split(/\r?\n/).map(l=>l.replace(/\s+/g,' ').trim()).filter(Boolean);
  let store='',date='';
  const head=lines.slice(0,8).join(' ').toLowerCase();
  for(const s of STORES){if(head.includes(s)){store=s.replace(/\b\w/g,c=>c.toUpperCase());if(s==='intermarch')store='Intermarché';break;}}
  if(!store&&lines[0]&&!/\d{2}[.,]\d{2}/.test(lines[0]))store=lines[0].slice(0,40);
  const dm=text.match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if(dm){let y=dm[3].length===2?'20'+dm[3]:dm[3];date=`${y}-${dm[2].padStart(2,'0')}-${dm[1].padStart(2,'0')}`;}
  const out=[],pending=[];
  const PRICE_ONLY=/^\s*(-?\d{1,4}[.,]\s?\d{2})\s*(?:€|eur)?\s*[A-Z*]?\s*$/i;
  const HEADER=/(\b\d{5}\b|\brue\b|\bavenue\b|\bav\.|\bbd\b|boulevard|\bplace\b|\bzone\b|\bcentre\b|\d{2}[ .]\d{2}[ .]\d{2}[ .]\d{2}|\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4}|\d{1,2}[:h]\d{2})/i;
  const low=store.toLowerCase();
  for(const ln of lines){
    if(SKIP.test(ln))continue;
    const po=ln.match(PRICE_ONLY);
    if(po){
      const price=parseFloat(po[1].replace(/\s/,'').replace(',','.'));
      const it=pending.shift();
      if(it&&price>0&&price<1000)it.total=price;
      continue;
    }
    let name,price=0;
    const m=ln.match(PRICE_END);
    if(m){name=m[1].trim();price=parseFloat(m[2].replace(/\s/,'').replace(',','.'));if(!(price>0)||price>999)continue;}
    else{
      if(HEADER.test(ln)||(low&&ln.toLowerCase().includes(low))||ln===lines[0])continue;
      name=ln.trim();
    }
    let qty=1;
    const q=name.match(/^(\d{1,2})\s*[x×*]\s*(.*)$/i);
    if(q){qty=parseInt(q[1],10);name=q[2];}
    name=name.replace(/\s*\d+\s*[x×]\s*\d+[.,]\d{2}\s*$/i,'').replace(/[\s.*]+$/,'').trim();
    if((name.match(/[A-Za-zÀ-ÿ]/g)||[]).length<3||name.length>60)continue;
    const it={name,term:searchTerm(name),qty,total:price};
    out.push(it);
    if(!price)pending.push(it);
  }
  return{store,date,items:out};
}
const UNITS=/^(g|kg|l|cl|ml|x|pce|pcs|pc|la|le|les|de|du|des|et|bte|sach|bio|u|uht|pk|lot)$/i;
function searchTerm(name){
  return name.toLowerCase().replace(/[^a-zà-ÿ0-9\s']/g,' ').split(/\s+/)
    .filter(w=>w.length>=3&&!/^\d/.test(w)&&!UNITS.test(w)).slice(0,3).join(' ');
}

let items=[],baseKey='pm_base_v1';

const getBase=()=>{try{return JSON.parse(localStorage.getItem(baseKey)||'[]')}catch{return[]}};

function baseStat(){const b=getBase();$('basestat').textContent=t('bstat')(b.length,b.reduce((a,r)=>a+r.items.length,0));}

/* ============ SCAN ============ */
function loadScript(src,g='Tesseract'){return new Promise((res,rej)=>{if(window[g])return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
$('file').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  $('ocrbox').hidden=false;$('ocrmsg').textContent=t('loadocr');$('ocrbar').style.width='3%';
  try{
    await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');

/* ============ COMPARE ============ */
const hav=(a,b,c,d)=>{const R=6371,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b);const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));};
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const fmt=n=>n.toLocaleString(lang==='fr'?'fr-FR':'en-GB',{style:'currency',currency:'EUR'});

const ACC={ecreme:'écrémé',ecremé:'écrémé',pates:'pâtes',pate:'pâte',cafe:'café',the:'thé',creme:'crème',fraiche:'fraîche',oeufs:'œufs',oeuf:'œuf',boeuf:'bœuf',epinards:'épinards',legumes:'légumes',cereales:'céréales',melange:'mélange',menage:'ménage',sucre:'sucré',sale:'salé',fume:'fumé',chevre:'chèvre',gruyere:'gruyère',ble:'blé',bebe:'bébé',poelee:'poêlée',specialite:'spécialité',deshydrate:'déshydraté',degraisse:'dégraissé'};
const sing=w=>w.length>4&&w.endsWith('s')?w.slice(0,-1):w;
async function codesFor(q){
  const p=new URLSearchParams({product_name__like:q,order_by:'-price_count',size:'25'});
  const r=await fetch('https://prices.openfoodfacts.org/api/v1/products?'+p);
  if(!r.ok)throw new Error(r.status);
  return((await r.json()).items||[]).map(x=>x.code);
}
async function findCodes(term){
  // several spellings of the search term, from most to least specific; results are merged
  const words=term.split(/\s+/).filter(Boolean),V=[];
  for(let n=words.length;n>=1;n--)V.push(words.slice(0,n).join(' '));
  const acc=words.map(w=>ACC[w]||w);
  for(let n=acc.length;n>=1;n--)V.push(acc.slice(0,n).join(' '));
  V.push(words.map(sing).join(' '));
  if(words.length>1)V.push(sing(words[words.length-1]));
  const uniq=[...new Set(V.filter(Boolean))].slice(0,6);
  const res=await Promise.all(uniq.map(q=>codesFor(q).catch(()=>[])));
  const out=[];res.forEach(l=>l.forEach(c=>{if(!out.includes(c))out.push(c);}));
  return out.slice(0,40);
}
async function fetchPrices(codes,mode,radius,term,size=60){
  const p=new URLSearchParams({product_code__in:codes.join(','),currency:'EUR',order_by:'price',size:String(size)});
  if(mode==='online')p.set('location__type','ONLINE');
  else{p.set('lat',loc.lat);p.set('lon',loc.lon);p.set('radius_km',radius);}
  const r=await fetch('https://prices.openfoodfacts.org/api/v1/prices?'+p);
  if(!r.ok)throw new Error(r.status);
  const j=await r.json();
  return(j.items||[]).filter(x=>x.price>0).map(x=>{
    const L=x.location||{},P=x.product||{};
    const d=(mode==='near'&&L.osm_lat!=null)?hav(loc.lat,loc.lon,L.osm_lat,L.osm_lon):null;
    return{price:x.price,store:L.type==='ONLINE'?(L.website_url||t('online_tag')):(L.osm_name||L.osm_brand||'?'),city:L.osm_address_city||'',
      product:[P.product_name,P.brands,P.quantity].filter(Boolean).join(' · ')||term,date:x.date||'',dist:d,online:L.type==='ONLINE',src:'op'};
  });
}
const WIDE=100;
async function fetchOpen(term,mode){
  const codes=await findCodes(term);
  if(!codes.length)return[];
  if(mode==='online')return fetchPrices(codes,mode,0,term);
  const [a,b]=await Promise.all([fetchPrices(codes,mode,radKm(),term),fetchPrices(codes,mode,Math.max(WIDE,radKm()),term,100)]);
  return a.concat(b);
}
function fromBase(term,mode){
  const toks=norm(term).split(/\s+/).filter(Boolean);if(!toks.length||mode!=='near')return[];
  const out=[];
  for(const rc of getBase()){
    if(rc.lat==null)continue;
    const dist=hav(loc.lat,loc.lon,rc.lat,rc.lon);if(dist>Math.max(WIDE,radKm()))continue;
    for(const it of rc.items){
      const n=norm(it.name);if(!toks.every(w=>n.includes(w)))continue;
      out.push({price:it.total/(it.qty||1),store:rc.store||'?',city:'',product:it.name,date:rc.date||'',dist,online:false,src:'mine'});
    }
  }
  return out;
}
const BRANDS=['carrefour','leclerc','auchan','lidl','aldi','intermarche','monoprix','franprix','casino','picard','biocoop','naturalia','cora','match','netto','grand frais','super u','hyper u','marche u','simply','g20','spar','colruyt','delhaize','leader price','supeco','thiriet','bio c bon','tesco','sainsbury','asda','walmart','kroger','costco','mercadona'];
const brandOf=n=>{const x=' '+norm(n||'').replace(/[^a-z0-9]+/g,' ')+' ';for(const b of BRANDS)if(x.includes(' '+b+' '))return b;return null;};
let stores=[],storeKey='';
async function nearbyStores(rkm){
  const key=[loc.lat.toFixed(3),loc.lon.toFixed(3),rkm].join('|');
  if(key===storeKey)return stores;
  const q=`[out:json][timeout:25];nwr["shop"~"^(supermarket|convenience|frozen_food|greengrocer|department_store|wholesale)$"](around:${Math.round(rkm*1000)},${loc.lat},${loc.lon});out center tags 250;`;
  const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q)});
  if(!r.ok)throw new Error(r.status);
  const j=await r.json(),seen=new Set(),out=[];
  (j.elements||[]).forEach(e=>{
    const tg=e.tags||{},la=e.lat??(e.center&&e.center.lat),lo=e.lon??(e.center&&e.center.lon),name=tg.name||tg.brand;
    if(!name||la==null)return;
    const dist=hav(loc.lat,loc.lon,la,lo),k=norm(name)+'|'+dist.toFixed(2);if(seen.has(k))return;seen.add(k);
    out.push({name,brand:brandOf(tg.brand)||brandOf(name),dist,lat:la,lon:lo});
  });
  out.sort((a,b)=>a.dist-b.dist);stores=out;storeKey=key;return out;
}
// A price seen at a store of a chain is used as an indication for the nearby stores of the same chain
function estimateOffers(offers,R){
  const out=[];
  stores.filter(x=>x.brand&&x.dist<=R).forEach(ns=>{
    const real=offers.some(o=>o.src==='op'&&!o.est&&o.dist!=null&&Math.abs(o.dist-ns.dist)<0.3&&brandOf(o.store)===ns.brand);
    if(real)return;
    const cand=offers.filter(o=>o.src==='op'&&!o.est&&brandOf(o.store)===ns.brand);
    if(!cand.length)return;
    const c=cand.reduce((a,b)=>a.price<=b.price?a:b);
    out.push({price:c.price,store:ns.name,city:'',product:c.product,date:c.date,dist:ns.dist,online:false,src:'op',est:true,from:c.store+(c.city?' ('+c.city+')':'')});
  });

}
const fd=d=>d==null?'':(d<1?Math.round(d*1000)+' m':d.toFixed(1)+' km');
$('go').onclick=async()=>{
  const mode=getMode();

  const valid=items.filter(i=>i.name.trim());

  if(mode==='near'){try{await nearbyStores(Math.min(radKm(),8));}catch{}}
  renderStores(mode);
  const results=new Array(valid.length);let done=0;
  const work=async(i)=>{
    const it=valid[i],term=(it.term||searchTerm(it.name)).trim();
    const unit=it.total>0?it.total/(it.qty||1):0;
    let offers=[],err=false;

    if($('usebase').checked)offers=offers.concat(fromBase(term,mode).filter(o=>!(o.store===it.store&&o.date===it.date&&Math.abs(o.price-unit)<0.005)));
    if(mode==='near'&&$('useest').checked&&stores.length)offers=offers.concat(estimateOffers(offers,radKm()));
    offers.sort((a,b)=>a.price-b.price);
    const seen=new Set();offers=offers.filter(o=>{const k=o.store+'|'+o.product+'|'+o.price+'|'+(o.dist!=null?o.dist.toFixed(1):'')+'|'+(o.est?1:0);if(seen.has(k))return false;seen.add(k);return true;});
    const R=radKm();
    const isNear=o=>mode==='online'||o.dist==null||o.dist<=R;
    const near=offers.filter(isNear).slice(0,5),far=offers.filter(o=>!isNear(o)).slice(0,5);
    results[i]={it,unit,term,near,far,nstores:stores.filter(x=>x.dist<=radKm()).slice(0,4),sel:near[0]||null,showFar:false,off:false,err};
    $('rbari').style.width=Math.round(++done/valid.length*100)+'%';
  };
  const q=valid.map((_,i)=>i);
  try{await Promise.all([0,1,2].map(async()=>{while(q.length)await work(q.shift());}));}
  finally{$('go').disabled=false;}
  renderResults(results);
  if($('keep').checked){
    const fresh=valid.filter(i=>i.fresh&&i.total>0),g={};
    fresh.forEach(i=>{const k=(i.store||store)+'|'+(i.date||date);(g[k]=g[k]||{store:i.store||store,date:i.date||date,lat:loc?loc.lat:null,lon:loc?loc.lon:null,items:[]}).items.push({name:i.name,qty:i.qty||1,total:i.total});i.fresh=false;});
    if(fresh.length){Object.values(g).forEach(r=>baseBefore.push(r));setBase(baseBefore);baseStat();}
  }
};

const isCheaper=r=>r.sel&&r.unit>0&&r.sel.price<r.unit-0.005;

    // outside the radius: only offers strictly cheaper than what was paid (and than the best nearby offer)

  arr.forEach(g=>{
    const d=document.createElement('div');d.className='plan';
    const where=g.stay?'':(g.o.online?t('online_tag'):[g.o.city,fd(g.o.dist)].filter(Boolean).join(' · '));
    const title=g.none?esc(t('nooffer')):g.stay?`${t('stayat')} ${esc(g.ss)}`:`🛒 ${esc(g.o.store)}${g.o.est?` <span class="tag">${t('est')}</span>`:''}${where?` <span class="small">— ${esc(where)}</span>`:''}`;
    d.innerHTML=`<h3><span>${title}</span><span class="small">${t('nitems')(g.rows.length)} · ${t('subtotal')} ${fmt(g.sum)}</span></h3><ul>`+
      g.rows.map(x=>`<li><span>${esc(x.name)}${x.q>1?' ×'+x.q:''}</span><b>${x.price!=null?fmt(x.price*x.q):esc(t('unknownp'))}</b></li>`).join('')+'</ul>';
    box.appendChild(d);
  });
}

/* ============ BASE ============ */
$('exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(getBase(),null,2)],{type:'application/json'}));a.download='panier-malin-base.json';a.click();};
$('clr').onclick=()=>{if(confirm(t('confirmclear'))){setBase([]);baseStat();}};
const msg=m=>{$('srcmsg').textContent=m;};
function cleanReceipt(r){
  if(!r||!Array.isArray(r.items))return null;
  const items=r.items.map(i=>({name:String(i.name??'').slice(0,80),qty:Number(i.qty)||1,total:Number(String(i.total).replace(',','.'))||0})).filter(i=>i.name&&i.total>0);
  if(!items.length)return null;
  const num=v=>(v===null||v===''||v===undefined||isNaN(Number(v)))?null:Number(v);
  return{store:String(r.store??'').slice(0,60),date:String(r.date??'').slice(0,10),lat:num(r.lat),lon:num(r.lon),items};
}
function mergeBase(list){
  const base=getBase(),keys=new Set(base.map(r=>JSON.stringify([r.store,r.date,r.items])));
  let add=0,dup=0;
  list.forEach(r=>{const k=JSON.stringify([r.store,r.date,r.items]);if(keys.has(k))dup++;else{keys.add(k);base.push(r);add++;}});
  setBase(base);baseStat();return[add,dup];
}
const XLS='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
$('expx').onclick=async()=>{
  try{await loadScript(XLS,'XLSX');}catch{msg(t('xlsfail'));return;}
  const rows=[];
  getBase().forEach(r=>r.items.forEach(i=>rows.push({Store:r.store,Date:r.date,Latitude:r.lat,Longitude:r.lon,Item:i.name,Quantity:i.qty,'Total EUR':i.total})));
  const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{Store:'',Date:'',Latitude:'',Longitude:'',Item:'',Quantity:'','Total EUR':''}]);
  ws['!cols']=[{wch:22},{wch:12},{wch:10},{wch:10},{wch:36},{wch:9},{wch:10}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Tickets');
  XLSX.writeFile(wb,'panier-malin-base.xlsx');
};
const xdate=v=>{if(typeof v==='number'&&v>20000){const d=new Date(Math.round((v-25569)*86400000));return d.toISOString().slice(0,10);}
  const m=String(v).match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:String(v||'').slice(0,10);};
function receiptsFromRows(rows){
  const col=(row,re)=>{const k=Object.keys(row).find(k=>re.test(k.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()));return k?row[k]:'';};
  const G=new Map();
  rows.forEach(row=>{
    const name=String(col(row,/^(article|item|produit|product)/)).trim();
    const total=parseFloat(String(col(row,/^(total|prix|price)/)).replace(',','.'));
    if(!name||!(total>0))return;
    const store=String(col(row,/^(enseigne|store|magasin)/)),date=xdate(col(row,/^date/));
    const lat=col(row,/^lat/),lon=col(row,/^lon/),k=[store,date,lat,lon].join('|');
    if(!G.has(k))G.set(k,{store,date,lat,lon,items:[]});
    G.get(k).items.push({name,qty:parseFloat(String(col(row,/^(qt|qty|quant)/)).replace(',','.'))||1,total});
  });
  return[...G.values()];
}
async function readFile(f){
  if(/\.json$/i.test(f.name)){let j=JSON.parse(await f.text());if(!Array.isArray(j))j=j.receipts||j.tickets||[];if(!Array.isArray(j))throw new Error('fmt');return j;}
  try{await loadScript(XLS,'XLSX');}catch{throw new Error('net');}
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
  return receiptsFromRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}));
}
$('impbtn').onclick=()=>$('fimp').click();
$('fimp').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  let list;
  try{list=(await readFile(f)).map(cleanReceipt).filter(Boolean);if(!list.length)throw new Error('fmt');}
  catch(err){msg(err&&err.message==='net'?t('xlsfail'):t('importfail'));return;}
  const [a,d]=mergeBase(list);
  const its=[];
  list.forEach(r=>r.items.forEach(i=>its.push({name:i.name,term:searchTerm(i.name)||i.name.toLowerCase(),qty:i.qty,total:i.total,store:r.store,date:r.date,fresh:false})));
  const n=addItems(its,f.name);
  msg(t('added')(n,f.name)+' '+t('imported')(a,d));
  $('review').scrollIntoView({behavior:'smooth'});
};
bfr.onclick=()=>{lang='fr';localStorage.setItem('pm_lang',lang);applyLang();};
ben.onclick=()=>{lang='en';localStorage.setItem('pm_lang',lang);applyLang();};
applyLang();
